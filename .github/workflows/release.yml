name: Validate tagged source candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to validate (publication is a separate owner action) (for example v0.1.1-alpha.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate exact tag syntax before checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 -c "import os,re; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta|rc)\.[0-9]+)?',os.environ['RELEASE_TAG'])"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '20'
      - name: Validate tag syntax and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c "import os,subprocess,tomllib; v=tomllib.load(open('Cargo.toml','rb'))['package']['version']; t=os.environ['RELEASE_TAG']; assert t=='v'+v; git=lambda ref:subprocess.check_output(['git','rev-parse','--verify',ref],text=True).strip(); assert git('HEAD')==git('refs/tags/'+t+'^{commit}')"
      - name: Build and validate
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-data libdeflate-dev
          python -m pip install -r scripts/packaging-requirements.txt -r scripts/test-requirements.txt
          npm ci --ignore-scripts --prefix bindings/node
          python scripts/build.py --test
          python scripts/test-rust-package.py --work scratch/rust-package --target-dir target/rust-package
          python scripts/package_release.py --local-use-only --output-dir dist/release
          python -m pip download --only-binary=:all: numpy==2.5.3 rasterio==1.5.1 blake3==1.0.8 --dest scratch/wheelhouse
          python tests/standalone_suite.py --artifacts dist/release --wheelhouse scratch/wheelhouse --output scratch/installed.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-source-candidate
          path: |
            dist/release/*-source.tar.gz
            scratch/rust-package/*.crate
            scratch/rust-package/RUST_PACKAGE_RECEIPT.json
          retention-days: 7
